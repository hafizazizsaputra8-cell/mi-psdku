services:
  # ==========================================
  # Product Service & Database
  # ==========================================
  product-db:
    image: mysql:8.0
    container_name: product-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=productdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    ports:
      - "3306:3306"
    volumes:
      - product-db-data:/var/lib/mysql
      - ./product-service/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=product-db
      - DB_USER=appuser
      - DB_PASSWORD=apppassword
      - DB_NAME=productdb
    depends_on:
      product-db:
        condition: service_healthy

  # ==========================================
  # Cart Service & Database
  # ==========================================
  cart-db:
    image: postgres:16-alpine
    container_name: cart-db
    environment:
      - POSTGRES_DB=cartdb
      - POSTGRES_USER=appuser
      - POSTGRES_PASSWORD=apppassword
    ports:
      - "5433:5432"
    volumes:
      - cart-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d cartdb"]
      interval: 10s
      retries: 5
      timeout: 5s

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "3001:3001"
    environment:
      - APP_NAME=cart-service
      - APP_ENV=local
      - APP_KEY=base64:7wA9QZ5E2eX4uM3aL8pK1vJ0nO9rS8tU7vW6xY5z1A0=
      - APP_DEBUG=true
      - DB_CONNECTION=pgsql
      - DB_HOST=cart-db
      - DB_PORT=5432
      - DB_DATABASE=cartdb
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppassword
      - LOG_CHANNEL=stderr
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - PRODUCT_SERVICE_BASE_URL=http://product-service:3000
    depends_on:
      cart-db:
        condition: service_healthy
      product-service:
        condition: service_started

  # ==========================================
  # Review Service & Database
  # ==========================================
  review-db:
    image: mongo:7
    container_name: review-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=appuser
      - MONGO_INITDB_ROOT_PASSWORD=apppassword
    ports:
      - "27017:27017"
    volumes:
      - review-db-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      retries: 5
      start_period: 20s
      timeout: 5s

  review-service:
    build: ./review-service
    container_name: review-service
    ports:
      - "3002:3002"
    environment:
      - HOST=0.0.0.0
      - PORT=3002
      - FLASK_DEBUG=1
      - MONGO_URI=mongodb://appuser:apppassword@review-db:27017/?authSource=admin
      - MONGO_DB_NAME=reviewdb
      - PRODUCT_SERVICE_URL=http://product-service:3000
    depends_on:
      review-db:
        condition: service_healthy
      product-service:
        condition: service_started

  # ==========================================
  # Order Service & Database (UTS)
  # ==========================================
  order-db:
    image: mysql:8.0
    container_name: order-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=orderdb
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
    ports:
      - "3307:3306"
    volumes:
      - order-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=localhost --user=root --password=rootpassword"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "3003:3003"
    environment:
      - APP_NAME=order-service
      - APP_ENV=local
      - APP_KEY=base64:7wA9QZ5E2eX4uM3aL8pK1vJ0nO9rS8tU7vW6xY5z1A0=
      - APP_DEBUG=true
      - APP_TIMEZONE=UTC
      - APP_URL=http://localhost:3003
      - LOG_CHANNEL=stderr
      - LOG_LEVEL=debug
      - DB_CONNECTION=mysql
      - DB_HOST=order-db
      - DB_PORT=3306
      - DB_DATABASE=orderdb
      - DB_USERNAME=appuser
      - DB_PASSWORD=apppassword
      - CART_SERVICE_URL=http://cart-service:3001
      - CART_SERVICE_TIMEOUT=5.0
      - PRODUCT_SERVICE_URL=http://product-service:3000
      - PRODUCT_SERVICE_TIMEOUT=5.0
    depends_on:
      order-db:
        condition: service_healthy
      cart-service:
        condition: service_started
      product-service:
        condition: service_started

volumes:
  product-db-data:
  cart-db-data:
  review-db-data:
  order-db-data:
